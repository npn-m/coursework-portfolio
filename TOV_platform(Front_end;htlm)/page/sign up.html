<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="signup.css">
    <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="navbar">
            <img class="image" src="logo.png"></img>
            <ul>
                <span class="material-symbols-outlined">home</span><t><a href="#">HOME</a></t>
                <t><a href="#">VTUBER</a></t>
                <t><a href="#">ARTIST</a></t>
                <div class="search-login">
                    <div class="search">
                        <input type="text" placeholder="Search" required />
                        <button>
                        <span class="icon material-symbols-outlined">search</span>
                        <span class="spinner"></span>
                        </button>
                    </div>
                    
                </div>
                <t><a href="log in.html">
                    <button class="login">Log in</button>
                </a></t>
                <t><a href="sign up.html">
                    <button class="signup">Sign Up</button>
                </a></t>
                <span class="material-symbols-outlined">account_circle</span>
            </ul>
            </div>
        </div>
    </header>

    <main>
        <section class="signup-section">
            <h2>Sign Up</h2>
            <div class="signup-box">
                <h>You Are</h>
                <select>
                    <option>Account Types : </option>
                    <option>VTuber</option>
                    <option>Artist</option>
                    <option>Viewer</option>
                </select>
                <label>Firstname</label>
                <input type="text" placeholder="Firstname">    
                <label>Lastname</label>    
                <input type="text" placeholder="Lastname">        
                <label>Gender</label>
                <select>
                    <option>Gender : </option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>LGBTQ+</option>
                </select>
                <label>Birthday</label>
                <input type="date" placeholder="DD / MM / YYYY">
                <label>Email</label>
                <input type="email" placeholder="Example@gmail.com">
                <label>Phone Number</label>
                <input type="tel" placeholder="Phone Number">
                <label>Account Name</label>
                <input type="text" placeholder="Account Name">
                <label>Username</label>
                <div class="user">
                    <input type="text" placeholder="Username" required />
                    <span class="material-symbols-outlined"> person </span>
                </div>
                <label>Password</label>
                <div class="password">
                    <input type="password" placeholder="Password" required />
                    <span class="material-symbols-outlined"> lock </span>
                </div>
                <label>Confirm Password</label>
                <div class="password">
                    <input type="password" placeholder="Password" required />
                    <span class="material-symbols-outlined"> lock </span>
                </div>
                <a href="log in.html"><button class="submit-btn">Submit</button></a>
            </div>
        </section>
    </main>
</body>
</html>
